spring.profiles.active=dev
logging.level.org.springframework.amqp=WARN

# H2 em arquivo (persistente)
spring.datasource.url=jdbc:h2:file:./data/hqs-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Google Books
integration.google.books.url=https://www.googleapis.com/books/v1/volumes?q=intitle:

#viacep
integration.viacep.url=https://viacep.com.br/ws

#pokemonApi
integration.pokedex.url=https://pokeapi.co/api/v2/pokemon/
integration.pokedex.chain.url=https://pokeapi.co/api/v2/evolution-chain/
integration.pokedex.species.url=https://pokeapi.co/api/v2/pokemon-species/

#StormGlass
integration.stormGlass.url=api.stormglass.io
integration.stormGlass.apikey=70bb1d52-06e8-11f1-b82f-0242ac120004-70bb1dac-06e8-11f1-b82f-0242ac120004
integration.stormGlass.params=airTemperature,precipitation,cloudCover,humidity
weather.mock = true

resilience4j.circuitbreaker.instances.pismo.sliding-window-size=10
resilience4j.circuitbreaker.instances.pismo.failure-rate-threshold=30
resilience4j.circuitbreaker.instances.pismo.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.pismo.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.pismo.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.pismo.minimum-number-of-calls=10

management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always

logging.level.root=INFO
# o %X{correlationId} e o que puxa o valor do MDC pro log
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{20} - correlationId=%X{correlationId} - %msg%n